<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="csrf-token" content="sandbox">

    <title>Accedi</title>

    
    <link rel="stylesheet" href="../css/auth-pages.css" type="text/css" media="all">
    
    </head>
<body class="min-h-screen bg-ink-50 font-sans text-ink-900 antialiased">

<div class="flex min-h-screen flex-col  lg:flex-row ">

            
        <aside class="relative hidden overflow-hidden bg-gradient-to-br from-brand-600 via-brand-700 to-brand-800 px-12 py-16 lg:flex lg:w-[42%] lg:max-w-[560px] lg:flex-col lg:justify-center xl:px-16">
            
            <div aria-hidden="true" class="pointer-events-none absolute -right-40 -top-40 h-[460px] w-[460px] rounded-full bg-white/10"></div>
            <div aria-hidden="true" class="pointer-events-none absolute -bottom-28 -left-28 h-[300px] w-[300px] rounded-full bg-white/[0.07]"></div>

            <div class="relative max-w-md">
                    <h2 class="font-display text-2xl font-bold leading-tight text-white">
    Un unico posto per tutte le tue spedizioni
</h2>

    <ul class="mt-7 space-y-3.5">
                    <li class="flex items-start gap-3.5 text-sm leading-relaxed text-white">
                
                <span class="mt-px flex h-[22px] w-[22px] shrink-0 items-center justify-center rounded-full bg-white/20">
                    <svg class="h-3.5 w-3.5 text-white" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path d="M7.6 14.2 3.8 10.4l1.4-1.4 2.4 2.4 6.2-6.2 1.4 1.4z"/>
                    </svg>
                </span>
                Gestisci le spedizioni e stampa le etichette
            </li>
                    <li class="flex items-start gap-3.5 text-sm leading-relaxed text-white">
                
                <span class="mt-px flex h-[22px] w-[22px] shrink-0 items-center justify-center rounded-full bg-white/20">
                    <svg class="h-3.5 w-3.5 text-white" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path d="M7.6 14.2 3.8 10.4l1.4-1.4 2.4 2.4 6.2-6.2 1.4 1.4z"/>
                    </svg>
                </span>
                Traccia le consegne in tempo reale
            </li>
                    <li class="flex items-start gap-3.5 text-sm leading-relaxed text-white">
                
                <span class="mt-px flex h-[22px] w-[22px] shrink-0 items-center justify-center rounded-full bg-white/20">
                    <svg class="h-3.5 w-3.5 text-white" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path d="M7.6 14.2 3.8 10.4l1.4-1.4 2.4 2.4 6.2-6.2 1.4 1.4z"/>
                    </svg>
                </span>
                Confronta le tariffe e scegli l’opzione migliore per ogni spedizione
            </li>
            </ul>

            </div>
        </aside>
    
    <main class="flex flex-1 flex-col">
        <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-5 py-16 sm:px-6">

            <div class="text-center">
                <a href="../index.html" class="inline-block" aria-label="Spedisci.online">
                                            <img src="../storage/logo.png" alt="Spedisci.online" width="158" class="mx-auto h-auto">
                                    </a>
                                    <h1 class="mt-7 font-display text-2xl font-bold leading-tight tracking-tight text-ink-900 sm:text-[1.75rem]">
                        Accedi                    </h1>
                                            </div>

            
            
            
            <div class="mt-8">
                    <div class="rounded-2xl border border-ink-200 bg-white p-6 shadow-lg shadow-ink-900/5 sm:p-8">
        <form method="POST" action="../login/index.html" class="space-y-5">
            <input type="hidden" name="_token" value="sandbox" autocomplete="off">
            <div>
    <label for="email" class="text-sm font-semibold text-ink-700">Indirizzo E-Mail</label>
    <input
        id="email"
        name="email"
        type="email"
        value=""
                 required          autocomplete="email"          autofocus         class="mt-1.5 w-full rounded-lg border bg-white px-4 py-3 text-sm text-ink-900 outline-none transition-colors focus:ring-2 border-ink-200 focus:border-brand-500 focus:ring-brand-500/20"
    >
    </div>

            <div>
    <div class="flex items-baseline justify-between gap-4">
        <label for="password" class="text-sm font-semibold text-ink-700">
            Password
                    </label>
                    <a href="../password/reset/index.html" class="text-xs font-semibold text-brand-600 hover:text-brand-700">Hai smarrito la password?</a>
            </div>

    <div class="relative mt-1.5">
        <input
            id="password"
            name="password"
            type="password"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            required
            autocomplete="current-password"
                        class="w-full rounded-lg border bg-white px-4 py-3 pr-11 text-sm text-ink-900 outline-none transition-colors focus:ring-2 border-ink-200 focus:border-brand-500 focus:ring-brand-500/20"
        >
        <button type="button" data-auth-reveal data-target="password" aria-label="Mostra password"
                class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-ink-400 transition-colors hover:text-brand-600">
            <svg data-icon-show viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg data-icon-hide viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden h-5 w-5" aria-hidden="true"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A10.1 10.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M9.9 9.9a3 3 0 1 0 4.2 4.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
    </div>

    </div>

            <label class="flex cursor-pointer items-center gap-2.5 text-sm text-ink-700" for="remember">
                <input type="checkbox" name="remember" id="remember" 
                       class="h-4 w-4 rounded border-ink-300 accent-brand-500">
                Ricordami
            </label>

            <button type="submit" class="w-full rounded-md bg-brand-500 px-6 py-3.5 font-bold text-white transition-colors hover:bg-brand-600">
                Accedi
            </button>
        </form>
    </div>
            </div>
        </div>

        <footer class="border-t border-ink-100 px-5 py-6 text-center text-xs text-ink-400">
            &copy; 2016–2026 Spedisci.online
        </footer>
    </main>

</div>

<script>
    // Password reveal toggles — no dependencies, progressive enhancement.
    document.querySelectorAll('[data-auth-reveal]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.getAttribute('data-target'));
            if (!input) return;

            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.querySelector('[data-icon-show]').classList.toggle('hidden', show);
            btn.querySelector('[data-icon-hide]').classList.toggle('hidden', !show);
            btn.setAttribute('aria-label', show ? 'Nascondi password' : 'Mostra password');
        });
    });
</script>
<script>document.addEventListener("submit",function(e){var f=e.target;if(f&&/login\/index\.html$/.test(f.getAttribute("action")||"")){e.preventDefault();window.location.href="../index.html";}},true);</script>
</body>
</html>
